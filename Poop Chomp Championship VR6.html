function hud(){bg.fillStyle='#1a0e06';bg.fillRect(0,0,1024,512);bg.textBaseline='middle';
 [me,...bots].forEach((r,i)=>{const y=70+i*105;bg.fillStyle='#fff';bg.font='bold 36px system-ui';bg.textAlign='left';bg.fillText(r.name,24,y-22);
  bg.fillStyle='#4a2b12';bg.fillRect(24,y,780,40);bg.fillStyle=r===me?'#ffd23f':'#c47a3a';bg.fillRect(24,y,780*Math.min(1,r.eaten/TARGET),40);
  bg.fillStyle='#fff';bg.textAlign='right';bg.fillText(Math.floor(r.eaten)+'/'+TARGET,1000,y+20)});
 if(cd>0){bg.fillStyle='rgba(0,0,0,.7)';bg.fillRect(0,0,1024,512);bg.fillStyle='#ffd27a';bg.font='bold 200px system-ui';bg.textAlign='center';bg.fillText(Math.ceil(cd),512,256)}
 bt.needsUpdate=true}
function start(k,opp){kind=k;me={name:'YOU',eaten:0};bots=opp;mode='play';cd=3.9;uiG.visible=false;board.visible=true;
 ctrls.forEach(c=>c.userData.held=null);pile.children.forEach(p=>{p.visible=true;p.userData.gone=0;p.position.copy(p.userData.home)});
 if(net)net.presence({eaten:0,ready:true})}
function eat(p){if(p.userData.gone)return;p.userData.gone=.6;p.visible=false;ctrls.forEach(c=>{if(c.userData.held===p){c.userData.held=null;try{c.userData.gp.hapticActuators[0].pulse(.8,80)}catch(e){}}});
 const n=Math.random()<.1*save.up.gold?2:1;me.eaten+=n;fart(n>1);burst(n>1);if(net)net.presence({eaten:me.eaten})}
function finish(){board.visible=false;const all=[me,...bots].sort((a,b)=>b.eaten-a.eaten),pl=all.indexOf(me)+1;
 const G={casual:[25,12,5,5],ranked:[60,30,10,10],friend:[40,15,8,8]}[kind][pl-1],rp=kind==='ranked'?[25,10,-10,-15][pl-1]:0;
 save.gems+=G;save.rp=Math.max(0,save.rp+rp);store();if(net)net.presence({ready:false});
 screen(pl===1?'🏆 YOU WON!':'You placed #'+pl,['Winner: '+all[0].name,'+'+G+'💎'+(kind==='ranked'?'   '+(rp>0?'+':'')+rp+' RP · '+tier():'')],[
 {t:'Play again',fn:()=>kind==='friend'?lobby():start(kind,kind==='ranked'?mk(bots.map(b=>b.rate)):mk(bots.map(b=>b.rate)))},{t:'Main menu',c:'#444',fn:home}]);
 if(kind==='friend'&&net)mode='ui'}

// ---------- controllers & input ----------
const ctrls=[0,1].map(i=>{const c=R.xr.getController(i);
 c.add(new T.Mesh(new T.SphereGeometry(.035,12,8),new T.MeshStandardMaterial({color:0xffc9a0})));
 const ray=new T.Mesh(new T.BoxGeometry(.004,.004,1.6),new T.MeshBasicMaterial({color:0xffe066}));ray.position.z=-.8;c.add(ray);
 c.userData={ray,held:null};c.addEventListener('connected',e=>{c.userData.gp=e.data.gamepad});
 c.addEventListener('selectstart',()=>press(c));c.addEventListener('selectend',()=>{const h=c.userData.held;if(h){h.position.copy(h.userData.home);c.userData.held=null}});S.add(c);return c});
function press(c){ac();
 if(mode!=='play'){tm.identity().extractRotation(c.matrixWorld);rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(tm);return click()}
 if(cd>0)return;let best=null,bd=.25+.05*save.up.reach;const cp=c.getWorldPosition(v2);
 pile.children.forEach(p=>{if(p.visible&&!ctrls.some(k=>k.userData.held===p)){const d=p.position.distanceTo(cp);if(d<bd){bd=d;best=p}}});c.userData.held=best}
R.domElement.addEventListener('pointerdown',e=>{if(R.xr.isPresenting)return;ac();
 rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},C);
 if(mode!=='play')return click();if(cd>0)return;
 const h=rc.intersectObjects(pile.children,true)[0];if(h){let o=h.object;while(o.parent!==pile)o=o.parent;if(o.visible)eat(o)}});

let last=0;
R.setAnimationLoop(t=>{const dt=Math.min((t-last)/1000||0,.1);last=t;anim(t,dt);
 pile.visible=mode==='play';ctrls.forEach(c=>c.userData.ray.visible=mode!=='play');
 if(mode==='play'){
  if(cd>0)cd-=dt;else{
   bots.forEach(b=>{b.eaten+=b.rate*dt*(.4+1.2*Math.random())});
   if(net)net.peers().forEach(p=>{if(!p.isMe){const b=bots.find(b=>b.peer===p.peer);if(b)b.eaten=p.presence.eaten||0}});
   const hp=C.getWorldPosition(v1);
   ctrls.forEach(c=>{const h=c.userData.held;if(h){const cp=c.getWorldPosition(v2);h.position.set(cp.x,cp.y-.1,cp.z);if(cp.distanceTo(hp)<.3+.05*save.up.mouth)eat(h)}});
   if(me.eaten>=TARGET||bots.some(b=>b.eaten>=TARGET))finish()}
  pile.children.forEach((p,i)=>{const u=p.userData;if(u.gone>0){u.gone-=dt;if(u.gone<=0){u.gone=0;p.visible=true;p.position.copy(u.home)}}
   p.rotation.y=Math.sin(t/400+i)*.5;p.scale.setScalar(1+.04*Math.sin(t/200+i))});
  hud()}
 R.render(S,C)});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});

const vb=$('#vr');
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok)return;vb.textContent='ENTER VR';
 vb.onclick=async()=>{let st='request';try{const rs=(m,o)=>navigator.xr.requestSession(m,o);let s,ar=false,log=[];for(const [m,o] of [['immersive-vr',{optionalFeatures:['local-floor']}],['immersive-vr'],['immersive-ar',{optionalFeatures:['local-floor']}],['immersive-ar']]){try{s=await rs(m,o);ar=m==='immersive-ar';break}catch(e1){log.push(m.slice(10)+':'+e1.name)}}if(!s)throw new Error('all modes failed ('+log.join(', ')+')');if(ar||(s.environmentBlendMode&&s.environmentBlendMode!=='opaque')){S.background=null;S.fog=null;floor.visible=false;wall.visible=false}st='setSession';ac();if(s.enabledFeatures&&!s.enabledFeatures.includes('local-floor')){R.xr.setReferenceSpaceType('local');rig.position.y=1.5}await R.xr.setSession(s)}catch(e){let d='';try{d=' | framed:'+(top!==self)+' xr-allowed:'+(document.featurePolicy?document.featurePolicy.allowsFeature('xr-spatial-tracking'):'n/a')}catch(x){}let pp='n/a';try{pp=(await navigator.permissions.query({name:'xr-spatial-tracking'})).state}catch(x){pp=x.name}const m='v5 VR failed at '+st+': '+(e&&e.name)+' - '+(e&&e.message)+d+' | spatial-permission:'+pp+' | '+navigator.userAgent.slice(0,70);const h=$('#hint');h.style.display='';h.textContent=m;vb.textContent='Retry VR'}}}).catch(()=>{});
R.xr.addEventListener('sessionstart',()=>{vb.style.display='none';$('#hint').style.display='none'});
R.xr.addEventListener('sessionend',()=>{rig.position.y=0;S.background=new T.Color(0x1c120a);S.fog=new T.Fog(0x1c120a,7,16);floor.visible=true;wall.visible=true;R.xr.setReferenceSpaceType('local-floor');vb.style.display='';$('#hint').style.display=''});
(async()=>{const h=$('#hint');if(!navigator.xr){h.textContent='No WebXR here. secure context: '+isSecureContext;return}const q=async m=>{try{return await navigator.xr.isSessionSupported(m)}catch(e){return e.name}};
 let perm='n/a';try{perm=(await navigator.permissions.query({name:'xr-spatial-tracking'})).state}catch(e){perm=e.name}h.textContent='v5 · Preview mode (click poops). WebXR check: vr='+await q('immersive-vr')+' ar='+await q('immersive-ar')+' spatial-permission='+perm+' secure='+isSecureContext})();
home();
})();
</script></body></html>
